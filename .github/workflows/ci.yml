name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Repo-wide checks; these don't depend on the OS.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ShellCheck (box, the one bash script)
        run: |
          bash -n skills/make-promo-reel/scripts/box
          shellcheck -S error skills/make-promo-reel/scripts/box
      - uses: astral-sh/setup-uv@v6
      - name: Valid skill (Agent Skills spec validator)
        run: uvx --from "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref" skills-ref validate skills/make-promo-reel
      - name: SKILL.md stays under 500 lines
        run: |
          n=$(wc -l < skills/make-promo-reel/SKILL.md)
          echo "SKILL.md: $n lines"
          [ "$n" -lt 500 ] || { echo "::warning file=skills/make-promo-reel/SKILL.md::$n lines; the spec recommends under 500. Move detail into references/."; }
      - name: JSON files parse
        run: for f in $(git ls-files '*.json'); do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: No personal paths in committed files
        run: |
          # A real home folder (/Users/<name>/, /home/<name>/, C:\Users\<name>) means a path from
          # someone's machine slipped in. Placeholders like /Users/<you>/ are fine. README.md is
          # skipped for its example permission rule.
          if git grep -nE '/(Users|home)/[A-Za-z0-9._-]+/|[A-Za-z]:\\Users\\[A-Za-z0-9._-]+' -- ':!README.md'; then
            echo "Replace personal paths with placeholders like /Users/<you>/ or <skill>/"
            exit 1
          fi
      - name: Music library lists
        run: node skills/make-promo-reel/scripts/music.mjs list

  # The skill's scripts and the studio template, on every OS the skill supports.
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check scripts
        run: for f in $(git ls-files '*.mjs'); do node --check "$f"; done
      - name: Script tests (guard, slim and rebuild, port, serve)
        run: node --test skills/make-promo-reel/tests/scripts.test.mjs
      - name: Template installs, synthesizes sounds and typechecks
        working-directory: skills/make-promo-reel/template
        run: |
          npm install --no-audit --no-fund
          npx tsc
          ls public/sfx/soft
      - name: Remotion's ffmpeg starts the way gif.mjs and loudness.mjs start it
        working-directory: skills/make-promo-reel/template
        run: |
          node --input-type=module -e "
            import { spawnSync } from 'node:child_process';
            import fs from 'node:fs';
            import { createRequire } from 'node:module';
            import path from 'node:path';
            const require = createRequire(path.resolve('gif.mjs'));
            const pkg = require.resolve('@remotion/cli/package.json');
            const cli = path.join(path.dirname(pkg), JSON.parse(fs.readFileSync(pkg, 'utf8')).bin.remotion);
            const r = spawnSync(process.execPath, [cli, 'ffmpeg', '-version'], { encoding: 'utf8' });
            console.log((r.stdout || r.stderr).split('\n')[0]);
            process.exit(r.status);
          "
